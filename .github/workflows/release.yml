name: Release KeyMind Desktop App

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux webview & GTK dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: |
          cd keymind-control-center
          npm install

      - name: Build Desktop Application (Tauri Action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./keymind-control-center
          tagName: v__VERSION__
          releaseName: 'KeyMind Control Center v__VERSION__'
          releaseBody: 'Cross-platform KeyMind Desktop Release (.dmg, .AppImage, .deb, .msi, .exe).'
          releaseDraft: true
          prerelease: false
