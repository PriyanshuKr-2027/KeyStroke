[package]
name = "keymind-autocorrect"
version = "0.1.0"
edition = "2021"
description = "Fast 4-layer autocorrect engine in Rust for real-time typing assistants."
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1.38", features = ["sync", "rt", "macros", "time", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symspell = "0.5"
parking_lot = "0.12"
rustc-hash = "2.1"
thiserror = "1.0"
tracing = "0.1"
keymind-jamspell = { path = "../keymind-jamspell" }

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
tokio = { version = "1.38", features = ["full"] }

[[bench]]
name = "autocorrect_bench"
harness = false
