[package]
name = "keymind-control-center"
version = "0.1.0"
description = "KeyMind Desktop Control Center App"
authors = ["KeyMind Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
chrono = "0.4"
dirs-next = "2.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
arboard = "3.4"
tracing = "0.1"
dotenvy = "0.15"
keymind-palette = { path = "../../keymind-palette" }
keymind-interceptor-windows = { path = "../../keymind-interceptor-windows" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
