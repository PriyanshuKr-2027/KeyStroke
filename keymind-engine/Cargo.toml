[package]
name = "keymind-engine"
version = "0.1.0"
edition = "2021"
description = "Core orchestrator engine for KeyMind connecting interceptors, autocorrect, variables, grammar, learning, prediction, and IPC server."
license = "MIT OR Apache-2.0"

[dependencies]
keymind-interceptor-windows = { path = "../keymind-interceptor-windows", optional = true }
keymind-interceptor-macos = { path = "..", optional = true }
keymind-ipc = { path = "../keymind-ipc" }
keymind-variables = { path = "../keymind-variables" }
keymind-autocorrect = { path = "../keymind-autocorrect" }
keymind-prediction = { path = "../keymind-prediction" }
keymind-learning = { path = "../keymind-learning" }
keymind-grammar = { path = "../keymind-grammar" }
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1.0"
dirs-next = "2.0"
dotenvy = "0.15"

[target.'cfg(windows)'.dependencies]
keymind-interceptor-windows = { path = "../keymind-interceptor-windows" }
