[package]
name = "keymind-grammar"
version = "0.1.0"
edition = "2021"
description = "LanguageTool wrapper for real-time sentence grammar checking and text fixing in Rust."
license = "MIT OR Apache-2.0"

[dependencies]
nlprule = "0.6"
tokio = { version = "1.38", features = ["sync", "rt-multi-thread", "macros", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lru = "0.12"
fnv = "1.0"
arboard = "3.4"
thiserror = "1.0"
parking_lot = "0.12"
tracing = "0.1"
async-trait = "0.1"

[build-dependencies]
nlprule-build = "0.6"

[dev-dependencies]
tokio = { version = "1.38", features = ["full"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation"] }

