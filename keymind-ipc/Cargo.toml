[package]
name = "keymind-ipc"
version = "0.1.0"
edition = "2021"
description = "SQLite migrations and Unix Domain Socket IPC server for KeyMind typing assistant."
license = "MIT OR Apache-2.0"

[dependencies]
keymind-variables = { path = "../keymind-variables" }
keymind-learning = { path = "../keymind-learning" }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
tracing = "0.1"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1.38", features = ["full"] }
