[package]
name = "keymind-prediction"
version = "0.1.0"
edition = "2021"
description = "Next-word prediction engine for KeyMind featuring sub-1ms Trigram SQLite model and ONNX async fallback."
license = "MIT OR Apache-2.0"

[dependencies]
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1.38", features = ["sync", "rt-multi-thread", "macros", "time"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
tracing = "0.1"
parking_lot = "0.12"
once_cell = "1.19"

[dev-dependencies]
tokio = { version = "1.38", features = ["full"] }
criterion = { version = "0.5", features = ["html_reports"] }
once_cell = "1.19"

[[bench]]
name = "prediction_bench"
harness = false
