[package]
name = "keymind-variables"
version = "0.1.0"
edition = "2021"
description = "Variable resolution engine for keymind typing assistant (static, dynamic, and Groq AI variables)."
license = "MIT OR Apache-2.0"

[dependencies]
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio"] }
chrono = "0.4"
uuid = { version = "1.8", features = ["v4"] }
arboard = "3.4"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
dirs-next = "2.0"
tokio = { version = "1.38", features = ["sync", "rt-multi-thread", "macros", "time"] }
thiserror = "1.0"
parking_lot = "0.12"
tracing = "0.1"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1.38", features = ["full"] }
